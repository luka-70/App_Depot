/* Layout: mappa a tutta altezza a destra, pannello di controllo + elenco a sinistra; su telefono mappa sopra, elenco sotto */
:root{
  --bg:#f1f4f6; --panel:#ffffff; --ink:#16212c; --muted:#5b6876; --line:#d9e0e6;
  --sea:#d6e4ee; --land:#fbfbf7; --border:#b9c5cf;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e4ebfb;
  --sagra:#e7a01a; --festa:#1f4fd1; --past:#9aa6b2;
  --radius:#0060ff;
  --display:"Bree Serif", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --panel:#131c25; --ink:#e7edf2; --muted:#93a2b0; --line:#26323e;
  --sea:#0a1117; --land:#1a2531; --border:#34424f;
  --accent:#7d9cff; --accent-ink:#0b1220; --accent-soft:#1c2a4a;
  --sagra:#f2b33a; --festa:#7d9cff; --past:#5d6b78; --radius:#4d94ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e151c; --panel:#131c25; --ink:#e7edf2; --muted:#93a2b0; --line:#26323e;
  --sea:#0a1117; --land:#1a2531; --border:#34424f;
  --accent:#7d9cff; --accent-ink:#0b1220; --accent-soft:#1c2a4a;
  --sagra:#f2b33a; --festa:#7d9cff; --past:#5d6b78; --radius:#4d94ff; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:minmax(320px,400px) 1fr}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.controls{padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
label.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{position:relative}
input[type=text],input[type=search],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sugg{position:absolute;z-index:1200;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.sugg button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:8px 11px;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.row{display:flex;gap:10px;align-items:center}
.radius-row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--accent)}

const UPDATED="29 ottobre 2026";

const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem('snr:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('snr:'+k,JSON.stringify(v))}catch(e){}}};

const state=Object.assign({center:[41.9632,12.7964],place:'Tivoli (RM)',radius:40,when:'30',d1:'',d2:'',text:'',sort:'dist'},store.get('state',{}));

// --- helpers
const iso=d=>d.toISOString().slice(0,10);
function today(){const t=new Date();t.setHours(12,0,0,0);return t}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function range(){
  const t=today();
  if(state.when==='all') return [iso(t),'9999-12-31'];
  if(state.when==='7') return [iso(t),iso(addDays(t,6))];
  if(state.when==='30') return [iso(t),iso(addDays(t,29))];
  if(state.when==='weekend'){const dow=t.getDay();const toSat=dow===0?-1:6-dow;const sat=addDays(t,toSat);const start=dow===0||dow===6?t:addDays(sat,-1);return [iso(start),iso(addDays(sat,1))]}
  return [state.d1||iso(t),state.d2||'9999-12-31'];
}
function km(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function fd(s){const [y,m,d]=s.split('-');return `${+d} ${MESI[+m-1]}`}
function dates(e){return e.s===e.e?fd(e.s):`${fd(e.s)} – ${fd(e.e)}`}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const FOOD=/sagra|castagn|marron|olio|oliv|vino|novello|tartuf|polent|fung|porcin|zucca|formagg|salam|bacc|gust|sapor|cena|pranzo|food|caldarr|bruschett|pane|miele|mela|cioccol|torron|birra|bagna|spied|porc|lumac|fagiol|pizza|bollito|cinghial|carciof|radicch|gnocc/i;
const isFood=e=>FOOD.test(e.n);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
EVENTS.forEach((e,i)=>{e.id=i;e.food=isFood(e);e.nn=norm(e.n+' '+e.c)});

// --- map
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:5,maxZoom:14,zoomSnap:.5,preferCanvas:false}).setView(state.center,9);
map.attributionControl.setPrefix(false).addAttribution('Confini: ISTAT/openpolis');
let provLayer, labelLayer;
function drawBase(){
  if(provLayer) provLayer.remove(); if(labelLayer) labelLayer.remove();
  provLayer=L.geoJSON(PROV,{interactive:false,style:{color:css('--border'),weight:1,fillColor:css('--land'),fillOpacity:1}}).addTo(map);
  labelLayer=L.layerGroup();
  PROV.features.forEach(f=>{const c=L.geoJSON(f).getBounds().getCenter();L.marker(c,{interactive:false,keyboard:false,icon:L.divIcon({className:'prov-label',html:esc(f.properties.prov_acr||''),iconSize:[24,12]})}).addTo(labelLayer)});
  const toggle=()=>{map.getZoom()>=7?labelLayer.addTo(map):labelLayer.remove()};
  map.off('zoomend',window.__lt); window.__lt=toggle; map.on('zoomend',toggle); toggle();
  provLayer.bringToBack();
}
drawBase();
const mq=matchMedia('(prefers-color-scheme: dark)');
const reTheme=()=>{drawBase();render()};
mq.addEventListener?.('change',reTheme);
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const circle=L.circle(state.center,{radius:state.radius*1000,color:css('--radius'),weight:4,opacity:.95,dashArray:'10 6',fillColor:css('--radius'),fillOpacity:.10,interactive:false}).addTo(map);
const pin=L.marker(state.center,{draggable:true,icon:L.divIcon({className:'center-wrap',html:'<div class="center-pin"></div>',iconSize:[22,22],iconAnchor:[11,11]}),title:'Centro della ricerca',zIndexOffset:1000}).addTo(map);
const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:36,spiderfyOnMaxZoom:true,disableClusteringAtZoom:12});
map.addLayer(cluster);
const markers=new Map();

pin.on('dragend',()=>{const p=pin.getLatLng();setCenter([p.lat,p.lng],nearestName([p.lat,p.lng]))});
map.on('click',ev=>setCenter([ev.latlng.lat,ev.latlng.lng],nearestName([ev.latlng.lat,ev.latlng.lng])));

function nearestName(p){let best=null,bd=1e9;for(const c of COMUNI){const d=(c[2]-p[0])**2+((c[3]-p[1])*Math.cos(p[0]*Math.PI/180))**2;if(d<bd){bd=d;best=c}}return best?`vicino a ${best[0]}${best[1]?' ('+best[1]+')':''}`:'punto scelto'}
function setCenter(c,place,fit){
  state.center=[+c[0].toFixed(5),+c[1].toFixed(5)];state.place=place;
  pin.setLatLng(state.center);circle.setLatLng(state.center);
  $('#q').value='';$('#q').placeholder=place.replace(/^vicino a /,'');
  render(fit);
}

// --- popup content
function popHtml(list){
  return list.map(e=>{
    const d=Math.round(km(state.center,[e.la,e.lo]));
    const alts=(e.alt||[]).filter(a=>a[1]!==e.u).map(a=>`<a href="${esc(a[1])}" target="_blank" rel="noopener">${esc(a[0])}</a>`);
    return `<div class="pop"><h3>${esc(e.n)}</h3><div class="meta">${esc(e.c)} · <b>${dates(e)}</b> · <b>${d} km</b></div>
    <a class="go" href="${esc(e.u)}" target="_blank" rel="noopener">Apri il sito dell'evento ↗</a>
    <div class="alt">${esc(host(e.u))}${alts.length?' · anche su '+alts.join(', '):''}</div></div>`}).join('');
}

// --- render
function filtered(){
  const [a,b]=range();const t=norm(state.text.trim());
  return EVENTS.filter(e=>e.e>=a&&e.s<=b&&(!t||e.nn.includes(t))).map(e=>(e.dist=km(state.center,[e.la,e.lo]),e)).filter(e=>e.dist<=state.radius);
}
let lastSel=null;
function render(fit){
  store.set('state',{center:state.center,place:state.place,radius:state.radius,when:state.when,d1:state.d1,d2:state.d2,sort:state.sort});
  circle.setRadius(state.radius*1000);circle.setStyle({color:css('--radius'),fillColor:css('--radius')});
  const res=filtered();
  res.sort(state.sort==='date'?(x,y)=>x.s.localeCompare(y.s)||x.dist-y.dist:(x,y)=>x.dist-y.dist);
  // markers grouped by same coordinates
  cluster.clearLayers();markers.clear();
  const groups=new Map();
  for(const e of res){const k=e.la.toFixed(3)+','+e.lo.toFixed(3);(groups.get(k)||groups.set(k,[]).get(k)).push(e)}
  const ink=css('--ink');
  for(const [k,list] of groups){
    const e=list[0];const food=list.some(x=>x.food);
    const m=L.circleMarker([e.la,e.lo],{radius:list.length>1?9:7,color:ink,weight:1.5,fillColor:css(food?'--sagra':'--festa'),fillOpacity:1});
    m.bindPopup(()=>popHtml(list),{maxWidth:300,autoPanPadding:[30,30]});
    m.bindTooltip(list.length>1?`${esc(e.c)} · ${list.length} eventi`:esc(e.n),{direction:'top',offset:[0,-6]});
    cluster.addLayer(m);list.forEach(x=>markers.set(x.id,m));
  }
  $('#cnt').textContent=res.length;
  $('#rv').textContent=state.radius+' km';
  const L_=$('#list');
  if(!res.length){L_.innerHTML=`<div class="empty">Nessun evento in ${state.radius} km per le date scelte.<br>Prova ad allargare il raggio o scegli “Tutte”.</div>`}
  else L_.innerHTML=res.map(e=>`<div class="item" data-id="${e.id}" tabindex="0" role="button"><span class="dot" style="background:var(${e.food?'--sagra':'--festa'})"></span><div style="min-width:0"><div class="t">${esc(e.n)}</div><div class="m">${esc(e.c)} · ${dates(e)}</div></div><span class="d">${e.dist<10?e.dist.toFixed(1):Math.round(e.dist)} km</span></div>`).join('');
  if(fit){map.fitBounds(circle.getBounds(),{padding:[20,20]})}
}
function openEvent(id){
  const m=markers.get(id);if(!m)return;
  document.querySelectorAll('.item.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelector(`.item[data-id="${id}"]`)?.classList.add('sel');
  cluster.zoomToShowLayer(m,()=>m.openPopup());
  if(matchMedia('(max-width:760px)').matches) document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth',block:'center'});
}
$('#list').addEventListener('click',ev=>{const it=ev.target.closest('.item');if(it)openEvent(+it.dataset.id)});
$('#list').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){const it=ev.target.closest('.item');if(it){ev.preventDefault();openEvent(+it.dataset.id)}}});

// --- controls
const r=$('#r');r.value=state.radius;
r.addEventListener('input',()=>{state.radius=+r.value;render()});
r.addEventListener('change',()=>map.fitBounds(circle.getBounds(),{padding:[20,20]}));
function syncWhen(){document.querySelectorAll('#when .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===state.when));$('#dates').classList.toggle('show',state.when==='custom')}
$('#when').addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;state.when=b.dataset.w;if(state.when==='custom'){const t=today();if(!state.d1)state.d1=iso(t);if(!state.d2)state.d2=iso(addDays(t,13))}$('#d1').value=state.d1;$('#d2').value=state.d2;syncWhen();render()});
$('#d1').addEventListener('change',e=>{state.d1=e.target.value;render()});
$('#d2').addEventListener('change',e=>{state.d2=e.target.value;render()});
$('#f').addEventListener('input',e=>{state.text=e.target.value;render()});
$('#sort').value=state.sort;$('#sort').addEventListener('change',e=>{state.sort=e.target.value;render()});

// comune search
const q=$('#q'),sg=$('#sugg');let hits=[],hi=0;
const CN=COMUNI.map(c=>norm(c[0]));
function showSugg(){
  const v=norm(q.value.trim());if(v.length<2){sg.hidden=true;return}
  hits=[];for(let i=0;i<COMUNI.length&&hits.length<40;i++){if(CN[i].startsWith(v))hits.push(i)}
  if(hits.length<8)for(let i=0;i<COMUNI.length&&hits.length<12;i++){if(!CN[i].startsWith(v)&&CN[i].includes(v))hits.push(i)}
  hits=hits.slice(0,12);hi=0;
  sg.innerHTML=hits.length?hits.map((i,k)=>`<button type="button" data-i="${i}" class="${k===0?'on':''}">${esc(COMUNI[i][0])}<small>${esc(COMUNI[i][1])}</small></button>`).join(''):'<div class="hint" style="padding:8px 11px">Nessun comune trovato</div>';
  sg.hidden=false;
}
function pick(i){const c=COMUNI[i];sg.hidden=true;q.blur();setCenter([c[2],c[3]],`${c[0]}${c[1]?' ('+c[1]+')':''}`,true)}
q.addEventListener('input',showSugg);
q.addEventListener('keydown',e=>{if(sg.hidden)return;const bs=[...sg.querySelectorAll('button')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,k)=>b.classList.toggle('on',k===hi))}else if(e.key==='Enter'&&hits.length){e.preventDefault();pick(hits[hi])}else if(e.key==='Escape'){sg.hidden=true}});
sg.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();pick(+b.dataset.i)}});
q.addEventListener('blur',()=>setTimeout(()=>sg.hidden=true,150));

// footer
const src={};EVENTS.forEach(e=>src[e.f]=(src[e.f]||0)+1);
$('#foot').innerHTML=`${EVENTS.length} eventi raccolti il ${UPDATED} da TrovaSagre, Sagre Autentiche, Sagrapedia, Sagriamo, Lazio in Festa e altre fonti web. Date e programmi possono cambiare: verifica sempre sul sito dell'evento prima di partire.`;

q.placeholder=state.place;
syncWhen();$('#d1').value=state.d1;$('#d2').value=state.d2;
render(true);
</script>

</body></html>
